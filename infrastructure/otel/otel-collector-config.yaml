# OpenTelemetry Collector Configuration
# For local development: outputs traces to container logs via the 'debug' exporter.
# For production (e.g., Datadog, Honeycomb, etc.): configure and uncomment the respective exporter.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  # Debug exporter (replaces legacy 'logging' exporter)
  # Prints spans and telemetry to container stdout for viewing with:
  #   docker logs -f ecommerce-otel-collector
  debug:
    verbosity: detailed

  # ---------------------------------------------------------------------------
  # DATADOG EXPORTER TEMPLATE (Uncomment when ready to export to Datadog)
  # ---------------------------------------------------------------------------
  # datadog:
  #   api:
  #     key: ${env:DD_API_KEY}
  #     site: ${env:DD_SITE} # e.g. datadoghq.com or datadoghq.eu
  #   traces:
  #     span_name_as_resource_name: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # To enable Datadog, add 'datadog' to the exporters list below:
      exporters: [debug]
    # metrics:
    #   receivers: [otlp]
    #   processors: [memory_limiter, batch]
    #   exporters: [debug]
  telemetry:
    logs:
      level: info
