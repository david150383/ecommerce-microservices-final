# OpenTelemetry Collector Configuration
# For local development: outputs traces & logs to container stdout via 'debug' exporter.
# For Datadog APM & Logs: exports traces & logs to Datadog using DD_API_KEY and DD_SITE.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  # Debug exporter (prints traces & logs to container stdout)
  debug:
    verbosity: detailed

  # Datadog exporter (sends traces & logs to Datadog backend)
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}
    traces:
      span_name_as_resource_name: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, datadog]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, datadog]
  telemetry:
    logs:
      level: info
